server {

  gzip on;
  gzip_static on;
  gzip_disable "msie6";
  gzip_proxied any;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types text/plain text/css text/html application/javascript application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;

  listen 8080;

  # k8s liveness/readiness probe
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Entry point — always revalidate so a deploy picks up the new asset hashes
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Vite content-hashed assets — safe to cache immutably
  location /assets/ {
    root /usr/share/nginx/html;
    etag off;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  error_page 500 502 503 504 /50x.html;

  location = /50x.html {
    root /usr/share/nginx/html;
  }

}
